name: Weekly backup

on:
  schedule:
    # 04:00 UTC every Sunday — after poll.yml's daily 03:00 run, so this
    # week's data is included; before regular waking hours in IST.
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flysmart-backend
        uses: actions/checkout@v4
        with:
          path: app

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: app
        run: bun run build

      # This repo (flysmart-backend) is public — real trip/price data must
      # never land here. Backups go to a separate private repo instead,
      # checked out alongside so the export step can write straight into it.
      - name: Checkout private backup repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Export collections
        working-directory: app
        run: node dist/scripts/backup.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BACKUP_DIR: ${{ github.workspace }}/backup-repo

      - name: Commit and push backup
        working-directory: backup-repo
        run: |
          git config user.name "FlySmart Backup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes since last backup — nothing to commit."
          else
            git commit -m "Backup $(date -u +%Y-%m-%d)"
            git push
          fi
